<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body><fieldset>
    <h1>Registration Form</h1>
    <form id="form">
        <label for="name">NAME:</label>
        <input type="text" id="name"><br><br>
        <span id="sp1" style="display: none">enter full name</span>

        <label for="roll">ROLL NUMBER:</label>
        <input type="text" id="roll"><br><br>
        <span id="sp2" style="display: none">enter vaild number</span>


        <label for="mobile">MOBILE:</label>
        <input type="text" id="mobile"><br><br>
        <span id="sp3" style="display: none">enter vaild number</span>


        <label for="pass">PASSWORD:</label>
        <input type="text" id="pass"><br><br>
        <span id="sp4" style="display: none">enter vaild Password</span>


        <input type="submit"></input>

    </form>
</fieldset>
    <script>
        let form=document.getElementById("form")
        let name=document.getElementById("name")
        let roll=document.getElementById("roll")
        let mobile=document.getElementById("mobile")
        let pass=document.getElementById("pass")

        form.addEventListener("submit",(e)=>{
            e.preventDefault(e)
        let pat1=/[a-z]/
        let method1=pat1.test(name.value)
        if(!method1){
            name.style.border="2px solid red"
            sp1.style.display="block"
            sp1.style.color="red"
        }

        let pat2=/(?=.[a-z])(?=.[0-9]){10}/
        let method2=pat2.test(roll.value)
        if(!method2){
            roll.style.border="2px solid red"
            sp2.style.display="block"
            sp2.style.color="red"

        }

        let pat3=/[0-9]/
        method3=pat3.test(mobile.value)
        if(!method3){
            mobile.style.border="2px solid red"
            sp3.style.display="block"
            sp3.style.color="red"

        }


        let pat4=/[0-9]/
        method4=pat4.test(pass.value)
        if(!method3){
            pass.style.border="2px solid red"
            sp4.style.display="block"
            sp4.style.color="red"

        }
        })


        
    </script>
</body>
</html>
